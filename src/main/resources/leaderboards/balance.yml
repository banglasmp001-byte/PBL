# BanglaLeaderboard - Balance Leaderboard Example
# Generated by BanglaLeaderboard

# Internal name (must match filename without .yml)
name: "balance"

# Enable/disable this leaderboard
enabled: true

# Display name (used in placeholders/messages, supports MiniMessage)
display-name: "<gold>Top Balance"

# PlaceholderAPI placeholder to track
# This can be ANY PlaceholderAPI placeholder!
placeholder: "%vault_eco_balance%"

# Sort order: DESC (highest first) or ASC (lowest first)
sort: DESC

# How often to refresh data (seconds)
# Set to 0 to disable auto-refresh
update-interval: 300

# Cache settings
cache:
  enabled: true
  duration: 300

# Number of top players to track
top-size: 10

# Number formatting
number-format:
  enabled: true
  use-suffixes: true   # 1000 -> 1K, 1000000 -> 1M
  decimal-places: 2

# Permission to view this leaderboard's placeholders
# Leave empty for no permission required
permission: ""

# Only count players from specific worlds (empty = all worlds)
world-filter: []

# Refresh behavior
refresh-on-join: false
refresh-on-quit: false
refresh-on-placeholder-change: false

# Combined placeholder format for %bl_balance_top_<pos>%
# Available variables: {medal} {rank} {name} {value} {formatted_value}
combined-format: "{medal} {name} - {formatted_value}"
