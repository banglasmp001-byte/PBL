name: Build BanglaLeaderboard

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaLeaderboard-${{ github.sha }}
          path: build/libs/BanglaLeaderboard-*.jar
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Get version
        id: version
        run: echo "version=$(grep '^version' build.gradle.kts | sed 's/.*= //' | tr -d '\"')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/libs/BanglaLeaderboard-*.jar
          tag_name: v${{ steps.version.outputs.version }}
          name: BanglaLeaderboard v${{ steps.version.outputs.version }}
          body: |
            ## BanglaLeaderboard v${{ steps.version.outputs.version }}
            
            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ### Requirements
            - Paper 1.21 - 1.21.11
            - Java 21
            - PlaceholderAPI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
